name: OCI ARM Instance Retry

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          EOF
          chmod 600 ~/.oci/config
          oci iam region list --output table > /dev/null && echo "OCI CLI configured OK"

      - name: Retry ARM instance launch
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          echo "$SSH_PUBLIC_KEY" | tr '\r\n' '  ' | tr -s ' ' | sed 's/^ //; s/ $//' > /tmp/key.pub
          echo '{ "ocpus": 1, "memoryInGBs": 6 }' > /tmp/shape.json
          
          for i in $(seq 1 3); do
            echo "════════ Attempt $i at $(date -u) ════════"
            
            OUTPUT=$(oci compute instance launch \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "dOaV:AP-HYDERABAD-1-AD-1" \
              --display-name "sanomin-whatsapp-server" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "file:///tmp/shape.json" \
              --image-id "$OCI_IMAGE_ID" \
              --subnet-id "$OCI_SUBNET_ID" \
              --assign-public-ip true \
              --ssh-authorized-keys-file /tmp/key.pub \
              --connection-timeout 30 \
              --read-timeout 60 \
              --no-retry \
              2>&1) || true
            
            echo "$OUTPUT"
            
            if echo "$OUTPUT" | grep -q '"lifecycle-state"'; then
              INSTANCE_ID=$(echo "$OUTPUT" | grep -oP '"id":\s*"\K[^"]+' | head -1)
              echo ""
              echo "════════════════════════════════════════════"
              echo "🎉🎉🎉 INSTANCE CREATED SUCCESSFULLY! 🎉🎉🎉"
              echo "════════════════════════════════════════════"
              echo "Instance OCID: $INSTANCE_ID"
              echo ""
              echo "Next: open OCI Console → Compute → Instances"
              echo "Find: sanomin-whatsapp-server → copy Public IP"
              echo "════════════════════════════════════════════"
              echo "::error title=🎉 INSTANCE CREATED::Instance OCID $INSTANCE_ID — check OCI Console for the public IP"
              exit 1
            fi
            
            if echo "$OUTPUT" | grep -qi "out of host capacity\|InternalError"; then
              echo "⏳ Out of capacity, waiting 150s..."
              sleep 150
            elif echo "$OUTPUT" | grep -qi "TooManyRequests\|LimitExceeded"; then
              echo "⏳ Rate limited, waiting 180s..."
              sleep 180
            else
              echo "❌ Unexpected error, aborting."
              exit 1
            fi
          done
          
          echo "🔁 Attempts exhausted, next run in ~7 min"
          exit 0

      - name: Show result
        if: always()
        run: echo "Workflow finished at $(date -u)"
